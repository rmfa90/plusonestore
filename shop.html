<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — Plus One Store</title>
  <meta name="description" content="Kedai dalam talian. Pakaian muslimah moden: labuh, longgar, jubah, kurung, batik, hijab, kosong &amp; plus size.">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Pergi ke kandungan</a>

  <header id="top">
    <div class="nav">
      <div class="wrap nav-inner">
        <a class="brand" href="index.html">
          <img src="images/plusone-logo.svg" alt="Plus One Store">
          <span>Plus One Store</span>
          <span class="tagline">Kedai Muslimah Moden</span>
        </a>
        <button class="menu-toggle" id="menu-toggle" aria-label="Buka menu">
          <span></span><span></span><span></span>
        </button>
        <nav class="menu" id="menu">
          <a href="index.html">Utama</a>
          <a href="shop.html" class="active">Shop</a>
          <a href="shop.html?cat=labuh-longgar">Labuh &amp; Longgar</a>
          <a href="shop.html?cat=jubah">Jubah &amp; Thobe</a>
          <a href="shop.html?cat=kurung">Kurung</a>
          <a href="shop.html?cat=batik">Batik</a>
          <a href="shop.html?cat=hijab">Hijab</a>
          <a href="about.html">Tentang</a>
          <a href="contact.html">Hubungi</a>
          <a href="cart.html" class="cart-btn">Beli
            <span class="badge" id="cart-count">0</span>
          </a>
        </nav>
      </div>
    </div>
  </header>

  <section class="pages-header" id="main">
    <div class="wrap">
      <h1>E-Commerce Shop</h1>
      <p class="sub">Klik produk untuk lihat butiran &amp; tambah ke beli.</p>
    </div>
  </section>

  <!-- filters -->
  <div class="wrap" style="padding:0 0 18px;">
    <div class="filters">
      <div class="group">Kategori:</div>
      <button class="filter-cat active btn-sm" data-cat="all">Semua</button>
      <button class="filter-cat btn-sm" data-cat="labuh-longgar">Labuh &amp; Longgar</button>
      <button class="filter-cat btn-sm" data-cat="jubah">Jubah &amp; Thobe</button>
      <button class="filter-cat btn-sm" data-cat="kurung">Kurung</button>
      <button class="filter-cat btn-sm" data-cat="kemeja">Kemeja</button>
      <button class="filter-cat btn-sm" data-cat="batik">Batik</button>
      <button class="filter-cat btn-sm" data-cat="hijab">Hijab</button>
      <button class="filter-cat btn-sm" data-cat="koszul">Kosong</button>
      <button class="filter-cat btn-sm" data-cat="plus-size">Plus Size</button>
      <button class="filter-cat btn-sm" data-cat="kids">Anak-anak</button>
      <button class="filter-cat btn-sm" data-cat="accessories">Aksesori</button>
      <div class="group" style="margin-left:auto;">Carian:</div>
      <input type="text" id="search-input" placeholder="Cari nama produk...">
    </div>
  </div>

  <div class="wrap">
    <div class="grid" id="shop-grid"></div>
  </div>

  <footer style="padding-top:0;">
    <div class="wrap">
      <div class="footer-bottom">
        <span>&copy; 2026 Plus One Store. Kedai dalam talian.</span>
        <span>Mangsa: 0800-1234 (Malaysia)</span>
      </div>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
